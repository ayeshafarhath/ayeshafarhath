<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated AI and machine learning background</title>
  <desc id="desc">A dark animated gradient background with floating pink, purple, and cyan particles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B1A"/>
      <stop offset="0.45" stop-color="#21103D"/>
      <stop offset="1" stop-color="#071D2E"/>
    </linearGradient>
    <radialGradient id="glowPink"><stop stop-color="#EC4899" stop-opacity=".55"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowBlue"><stop stop-color="#22D3EE" stop-opacity=".38"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#F8BBD0" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <ellipse cx="280" cy="120" rx="300" ry="220" fill="url(#glowPink)" filter="url(#blur)">
    <animate attributeName="cx" values="280;430;280" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;250;120" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1330" cy="300" rx="340" ry="240" fill="url(#glowBlue)" filter="url(#blur)">
    <animate attributeName="cx" values="1330;1130;1330" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;170;300" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="#F8BBD0">
    <circle cx="120" cy="310" r="3"><animate attributeName="cy" values="310;90;310" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="70" r="2"><animate attributeName="cy" values="70;350;70" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="330" r="3"><animate attributeName="cy" values="330;60;330" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="80" r="2"><animate attributeName="cy" values="80;350;80" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="1460" cy="120" r="3"><animate attributeName="cy" values="120;350;120" dur="12s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="none" stroke="#EF93C4" stroke-opacity=".28" stroke-width="2">
    <path d="M0 330 C260 190 360 390 610 240 S1060 100 1600 250">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M0 330 C260 190 360 390 610 240 S1060 100 1600 250;M0 250 C260 390 360 150 610 300 S1060 350 1600 150;M0 330 C260 190 360 390 610 240 S1060 100 1600 250"/>
    </path>
  </g>
  <g fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="800" y="190" font-size="52" font-weight="700">Ayesha Farhath</text>
    <text x="800" y="235" font-size="22" fill="#F8BBD0">AI/ML Engineer • Python Developer • Data &amp; Computer Vision</text>
  </g>
</svg>
